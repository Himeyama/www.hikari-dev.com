name = "hikari-dev-cms"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = ""

[[routes]]
pattern = "cms-api.hikari-dev.com"
custom_domain = true

[vars]
GITHUB_OWNER = "himeyama"
GITHUB_REPO = "www.hikari-dev.com"
GITHUB_BRANCH = "docusaurus"
ALLOWED_ORIGINS = "https://www.hikari-dev.com,http://localhost:3000"
CF_ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
CF_ACCESS_AUD = "your-audience-tag"

# Secrets (set via wrangler secret put):
# GITHUB_TOKEN  — GitHub PAT (contents:write)
# ADMIN_SECRET  — Bearer token for /admin (strong random string)
# PAGES_DEPLOY_HOOK — Cloudflare Pages deploy hook URL (optional, enables /api/build)
