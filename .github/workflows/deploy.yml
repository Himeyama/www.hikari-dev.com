name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - docusaurus
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Docusaurus build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            .docusaurus
          key: docusaurus-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'docusaurus.config.ts') }}-${{ hashFiles('blog/**', 'sukisuki/**', 'src/**', 'i18n/**') }}
          restore-keys: |
            docusaurus-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'docusaurus.config.ts') }}-
            docusaurus-${{ runner.os }}-

      - name: Build website
        run: pnpm run build
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
      
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name=www-hikari-dev-com --branch=docusaurus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
